<section class="lista-users">

  <div class="section-sup">

    <div class="number-products">
      <label for="num">Mostrar </label>
      <select name="" id="num" [(ngModel)]="selectedLimit" (change)="onLimitChange()">
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="15">15</option>
      </select>
      <p> usuarios</p>
    </div>

    <div class="paginacion">
      <button (click)="prevPage()" [disabled]="currentPage === 1">
        <i class='bx bx-chevron-left'></i>
      </button>
      <span>Página {{ currentPage }} de {{ totalPages }}</span>
      <button (click)="nextPage()" [disabled]="currentPage === totalPages">
        <i class='bx bx-chevron-right'></i>
      </button>
    </div>

    <div class="container-buttons">
      <button id="eliminar" (click)="confirmDelete(selectedUserId)" popovertarget="popup-eliminar">
        <i class='bx bx-minus'></i>
      </button>
      <button id="modificar" (click)="openEditRoleModal(selectedUser)" popovertarget="popup-editar-rol">
        <i class='bx bxs-edit'></i>
      </button>
    </div>

    <div class="container-search">
      <input type="text" name="buscar" placeholder="Buscar por nombre o correo" [(ngModel)]="filterPost" (input)="onFilterChange()">
    </div>

  </div>

  <div class="container-tabla">
    <table>
      <thead>
        <tr>
          <th>Nombre completo</th>
          <th>Nombre de usuario</th>
          <th>Email</th>
          <th>Rol</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of filteredUsers"
            (click)="selectedUser = user"
            [class.selected]="selectedUser?.id === user.id">
          <td>{{ user.fullName }}</td>
          <td>{{ user.username }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.role }}</td>
        </tr>
      </tbody>
    </table>
  </div>

</section>

<div class="pop-ups-fondo" popover id="popup-eliminar">

  <div id="pop-up-eliminar">

    <div class="bar-sup">
      <h2>Eliminar usuario</h2>
      <button popovertarget="popup-eliminar" popovertargetaction="hide">
        <i class='bx bx-x'></i>
      </button>
    </div>

    <div id="form-eliminar">
      <p>¿Estás seguro de eliminar a {{ selectedUser?.fullName }}?</p>
      <button id="btn-eliminar" (click)="deleteUser()">
        Eliminar
      </button>
    </div>

  </div>

</div>

<div class="pop-ups-fondo" popover id="popup-editar-rol">

  <div id="pop-up-mod">

    <div class="bar-sup">
      <h2>Editar rol de usuario</h2>
      <button popovertarget="popup-editar-rol" popovertargetaction="hide">
        <i class='bx bx-x'></i>
      </button>
    </div>

    <div class="forms">
      <form action="" id="form-mod">
        <label for="nombre">Nombre del usuario</label>
        <input type="text" id="nombre" [value]="selectedUser?.fullName" readonly>

        <label for="rol">Rol actual</label>
        <input type="text" id="rol" [value]="selectedUser?.role" readonly>

        <label for="nuevo-rol">Nuevo rol</label>
        <select id="nuevo-rol" [(ngModel)]="newRole" name="newRole">
          <option value="user">Usuario</option>
          <option value="admin">Administrador</option>
        </select>

        <button type="button" id="btn-mod" (click)="updateRole()">Guardar</button>
      </form>
    </div>

  </div>

</div>
